<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/new/">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="Chi 的個人網站導航與常用工具箱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-touch-icon" href="../assets/icon/icon-wb.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon/icon-wb.png">
<title>Chi NAV · 個人導航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="new.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" id="brand-home" href="/new/" aria-label="Chi NAV 首頁">
      <span class="brand-mark"><img class="brand-icon brand-icon-light" src="../assets/icon/icon-bw.png" alt=""><img class="brand-icon brand-icon-dark" src="../assets/icon/icon-wb.png" alt=""></span>
      <span class="brand-copy"><strong>Chi NAV</strong><small>PERSONAL SPACE</small></span>
    </a>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收合側邊欄" title="收合側邊欄"><span aria-hidden="true">‹</span></button>
    <div class="nav-caption">工作區</div>
    <nav class="nav-menu" id="js-nav-menu" aria-label="網站分類"></nav>
    <div class="sidebar-bottom"><span class="sidebar-status"></span><span>個人導航</span><span class="sidebar-version">NAV</span></div>
  </aside>
  <main id="home" class="main-content">
    <header class="topbar">
      <div class="mobile-brand"><button id="mobile-menu-toggle" type="button" aria-label="開啟導覽選單">☰</button><span>Chi NAV</span></div>
      <div class="page-intro"><div class="eyebrow"><span class="eyebrow-line"></span> PERSONAL NAVIGATOR</div><h2>Chi 的工具箱</h2><p>常用網站、收藏與分類連結，集中在這裡。</p></div>
      <div class="topbar-tools">
        <label class="search-box" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="搜尋網站、分類或關鍵字…" autocomplete="off" aria-label="搜尋網站、分類或關鍵字"><button class="search-clear" id="search-clear" type="button" aria-label="清除搜尋">×</button><span class="shortcut"><kbd>⌘</kbd><kbd>K</kbd></span><span id="search-result-info" aria-live="polite"></span></label>
        <button class="command-trigger" id="command-trigger" type="button" aria-label="開啟快速搜尋"><span>↗</span><span>快速開啟</span><kbd>Ctrl K</kbd></button>
      </div>
    </header>
    <div class="content-wrap">
      <div class="section-overline"><span>YOUR SPACE</span><span class="section-rule"></span><span class="section-note">LINKS & TOOLS</span></div>
      <div id="js-main-content" aria-live="polite" aria-busy="true"><div class="app-loading" role="status">正在準備你的導航…</div></div>
    </div>
    <footer class="site-footer"><span>CHI NAV <span class="footer-separator">/</span> PERSONAL LINK HUB</span><span id="site-version" class="site-version" aria-label="目前版本"></span></footer>
  </main>
</div>
<div class="mobile-scrim" id="mobile-scrim"></div>
<div class="command-palette" id="command-palette" aria-hidden="true"><div class="command-backdrop" data-command-close></div><section class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title"><div class="command-head"><span aria-hidden="true">⌕</span><span id="command-title" class="sr-only">搜尋網站與指令</span><input id="command-input" type="search" placeholder="輸入網站、分類或指令…" autocomplete="off" aria-label="快速搜尋"><button type="button" data-command-close aria-label="關閉">×</button></div><div class="command-hint" id="command-hint">↑ ↓ 選擇　·　Enter 開啟　·　Esc 關閉</div><div class="command-results" id="command-results"></div></section></div>
<div class="toast" id="js-toast" role="status"><div class="toast-title"><span aria-hidden="true">✓</span><span>腳本已複製</span></div><div class="toast-desc">請到對應網頁開啟 Console 後貼上執行。</div></div>
<script src="js/utils.js"></script><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/update.js"></script><script src="js/search.js"></script><script src="js/navigation.js"></script><script src="js/render.js"></script><script src="js/data/metadata.js"></script><script src="js/app.js"></script><script src="js/card-tooltip.js"></script><script src="js/bootstrap.js"></script>
<script>
(() => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('mobile-menu-toggle');
  const scrim = document.getElementById('mobile-scrim');
  const close = () => { sidebar?.classList.remove('mobile-open'); scrim?.classList.remove('visible'); };
  toggle?.addEventListener('click', () => { sidebar?.classList.toggle('mobile-open'); scrim?.classList.toggle('visible'); });
  scrim?.addEventListener('click', close);
  document.addEventListener('click', e => { if (e.target.closest('#command-trigger')) { if (typeof openCommand === 'function') openCommand(); } });
  const observer = new MutationObserver(() => { if (window.matchMedia('(max-width: 760px)').matches && eHasNavAction()) close(); });
  function eHasNavAction(){ return !!document.querySelector('.nav-item.active'); }
  const nav = document.getElementById('js-nav-menu'); if (nav) observer.observe(nav, {subtree:true,attributes:true,attributeFilter:['class']});
})();
</script>
</body>
</html>
