name: Deploy NAV Admin API

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-admin-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nav-admin-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_NAV_ADMIN_API == 'true' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Worker syntax
        run: npm run check
      - name: Configure GitHub access token
        env:
          NAV_GITHUB_TOKEN: ${{ secrets.NAV_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$NAV_GITHUB_TOKEN" | npx wrangler secret put NAV_GITHUB_TOKEN
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHI_AUTH_CLIENT_ID: ${{ secrets.CHI_AUTH_CLIENT_ID }}
        run: npx wrangler deploy --var "CHI_AUTH_CLIENT_ID:$CHI_AUTH_CLIENT_ID"
