name: Validate NAV

on:
  push:
    branches: [main]
    paths:
      - 'data/data.json'
      - 'scripts/validate-data.mjs'
      - 'js/**'
      - 'admin/**'
      - 'worker/**'
      - 'bookmarks/**'
      - 'sw.js'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/data.json'
      - 'scripts/validate-data.mjs'
      - 'js/**'
      - 'admin/**'
      - 'worker/**'
      - 'bookmarks/**'
      - 'sw.js'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-nav-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate navigation data
        run: node scripts/validate-data.mjs
      - name: Check JavaScript syntax
        run: |
          find js admin bookmarks -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check worker/admin-api.js
          node --check sw.js
