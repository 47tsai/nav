name: Auto Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update version and changelog
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version_path = Path('version.json')
          changelog_path = Path('changelog.json')
          info = json.loads(version_path.read_text(encoding='utf-8'))
          parts = [int(x) for x in info['version'].split('.')]
          if len(parts) != 4:
              raise SystemExit('version must use MAJOR.MINOR.COMMIT.ADMIN format')

          message = os.environ['COMMIT_MESSAGE'].splitlines()[0]
          is_admin = message.lower().startswith('[admin]')
          parts[3 if is_admin else 2] += 1
          new_version = '.'.join(map(str, parts))
          now = datetime.now(timezone.utc).astimezone().strftime('%Y-%m-%d')

          entry = {
              'version': new_version,
              'date': now,
              'type': 'admin' if is_admin else 'commit',
              'message': message,
              'commit': os.environ['COMMIT_SHA']
          }
          info.update({
              'version': new_version,
              'date': now,
              'type': entry['type'],
              'message': message
          })
          version_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          log = json.loads(changelog_path.read_text(encoding='utf-8')) if changelog_path.exists() else []
          log.insert(0, entry)
          changelog_path.write_text(json.dumps(log, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated version to {new_version} ({entry["type"]})')
          PY

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json changelog.json
          git commit -m "chore: auto bump version [skip ci]"
          git push
