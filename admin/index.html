<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Chi NAV Admin</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f6f8}body{margin:0;padding:32px}.panel{max-width:760px;margin:auto;background:#fff;border:1px solid #e1e5ec;border-radius:20px;padding:28px;box-shadow:0 16px 50px #00000012}h1{margin:0 0 6px}.muted{color:#687386;font-size:14px}.grid{display:grid;gap:14px;margin-top:24px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dfe4ec;border-radius:10px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.actions button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}.primary{background:#356ae6;color:#fff}.status{min-height:20px;font-size:13px}.back{display:inline-block;margin-bottom:24px;color:#356ae6;text-decoration:none}
</style>
</head>
<body>
<main class="panel">
<a class="back" href="../">← 返回 NAV</a>
<h1>Chi NAV Admin</h1>
<p class="muted">管理入口。提交操作仍需要 Admin Secret，請勿將密鑰分享給他人。</p>
<form id="quick-add" class="grid" novalidate>
<div class="field"><label for="title">網站名稱</label><input id="title" name="title" placeholder="例如：Speedtest"></div>
<div class="field"><label for="url">網址</label><input id="url" name="url" type="url" placeholder="https://example.com"></div>
<div class="field"><label for="taxonomy">分類</label><select id="taxonomy" name="taxonomy"></select></div>
<div class="field"><label for="subcategory">子分類</label><select id="subcategory" name="subcategory"></select></div>
<div class="field"><label for="description">描述</label><textarea id="description" name="description" placeholder="簡短描述網站用途"></textarea></div>
<div class="actions"><button type="submit" class="primary">新增網站</button></div>
<div id="status" class="status" aria-live="polite"></div>
</form>
</main>
<script src="quick-add.js"></script>
</body>
</html>
