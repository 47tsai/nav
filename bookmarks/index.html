<!doctype html>
<html lang="zh-Hant" data-chi-theme="light" data-chi-layout="sidebar" data-chi-brand="nav">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 書籤列 — 主站裡的一頁，不是獨立站（2026-11-16 遷到 chi-system 架構）
  - 跟主站 index.html 同一套殼層與同一份視覺層：theme.js / sidebar.js / tokens.css /
    components.css，外加主站同一份 css/nav.css；bookmarks.css 只留書籤頁自己的樣式
    （卡片裡的內嵌 SVG 圖示大小，見 bookmarks.js 的 ChiIcon.icon() 呼叫）。
  - 收合 key chi-nav-sidebar-collapsed、主題 key chi-theme-mode、品牌 Chi導航、識別色 #008CAD。
  - 側邊欄連結只有一份來源：../js/sidebar-nav.js 的 renderSidebarNav()，分類來自
    ../data/data.json（sidebarGroups），連結前綴 '/' 指回主站；這頁沒有對應的
    active 項目。舊的 ../js/theme.js（chi-nav-theme）與舊 CSS（style.css /
    theme.css / enhancements.css 等）已不再載入。
  - 內容：15 個固定書籤（bookmarks.js 內建清單），搜尋、清除、Ctrl+K 聚焦保留。 -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="Chi 的快速書籤列">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/47tsai/chi-system/main/logo/nav-w.png">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/47tsai/chi-system/main/logo/nav-w.png">
<title>書籤列 · Chi導航</title>
<script src="../chi-system/theme.js"></script>
<script src="../chi-system/sidebar.js" data-chi-sidebar-key="chi-nav-sidebar-collapsed"></script>
<link rel="stylesheet" href="../chi-system/tokens.css">
<link rel="stylesheet" href="../chi-system/components.css">
<script src="../chi-system/icon.js"></script>
<link rel="stylesheet" href="../css/nav.css">
<link rel="stylesheet" href="bookmarks.css">
</head>
<body>
<div class="chi-shell">
  <!-- 側邊欄外殼由 js/sidebar-shell.js 注入（三頁共用），不要在這裡手寫 aside -->
  <div id="js-sidebar-shell"></div>
  <div class="chi-content">
    <!-- 手機版標頭由 js/sidebar-shell.js 注入（三頁共用）；腳本須放在兩個 placeholder 之後、解析期同步執行 -->
    <div id="js-mobile-header"></div>
    <script src="../js/sidebar-shell.js"></script>
    <main class="chi-main" id="home">
      <header class="topbar">
        <div class="page-intro"><div class="eyebrow"><span class="eyebrow-line"></span> PERSONAL NAVIGATOR</div><h2>我的書籤列</h2><p>平常最常用的網站，集中放在這裡。</p></div>
        <div class="topbar-tools">
          <label class="search-box" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="搜尋書籤…" autocomplete="off" aria-label="搜尋書籤"><button class="search-clear" id="search-clear" type="button" aria-label="清除搜尋">×</button><span class="shortcut"><kbd>⌘</kbd><kbd>K</kbd></span></label>
        </div>
      </header>
      <div class="content-wrap">
        <div class="section-overline"><span>YOUR SPACE</span><span class="section-rule"></span><span class="section-note">BOOKMARKS</span></div>
        <section class="launcher-page" id="bookmarks">
          <div class="launcher-page-head"><h2><svg class="chi-icon" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M0 48V487.7C0 501.1 10.9 512 24.3 512c5 0 9.9-1.5 14-4.4L192 400 345.7 507.6c4.1 2.9 9 4.4 14 4.4c13.4 0 24.3-10.9 24.3-24.3V48c0-26.5-21.5-48-48-48H48C21.5 0 0 21.5 0 48z"/></svg>書籤列</h2></div>
          <div class="grid" id="bookmark-grid"></div>
          <div class="empty-state" id="empty-state" hidden>找不到符合的書籤。</div>
        </section>
      </div>
      <footer class="chi-footer"><span class="chi-footer__name">Chi導航</span><span id="site-version" class="chi-footer__version" aria-label="目前版本"></span></footer>
    </main>
  </div>
</div>
<script src="../js/sidebar-nav.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
